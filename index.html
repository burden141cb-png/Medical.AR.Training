<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medical Billing Training Index</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        background-color: #f4f4f4;
    }
    #sidebar {
        width: 280px;
        background-color: #2F4F4F;
        color: white;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
    }
    #sidebar h2 {
        font-size: 20px;
        margin-top: 0;
    }
    #searchInput {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
    }
    #sidebar ul {
        list-style: none;
        padding-left: 0;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
    }
    #sidebar li {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 3px;
    }
    #sidebar li:hover, #sidebar li.active {
        background-color: #556B2F;
    }
    #content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: #f4f4f4;
    }
    h1, h3 {
        color: #2F4F4F;
        margin-bottom: 5px;
    }
    ol {
        margin-top: 0;
    }
    #error {
        color: red;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="sidebar">
    <h2>Denial Categories</h2>
    <input type="text" id="searchInput" placeholder="Search codes or keywords..." />
    <ul id="denialList">
        <!-- Denial codes loaded dynamically here -->
    </ul>
</div>

<div id="content">
    <div id="error"></div>
    <div id="denialDetails">
        <h1>Welcome to Medical Billing Training</h1>
        <p>Select a denial code from the list to see details here.</p>
    </div>
</div>

<script>
// Variables to store data and track selected code
let denials = [];
const denialList = document.getElementById('denialList');
const denialDetails = document.getElementById('denialDetails');
const searchInput = document.getElementById('searchInput');
const errorDiv = document.getElementById('error');

function displayDenial(denial) {
    denialDetails.innerHTML = `
        <h1>${denial.code} - ${denial.title}</h1>
        <h3>Category: ${denial.category}</h3>
        <h3>Clinics: ${denial.clinic.join(', ')}</h3>
        <h3>Step-by-step resolution:</h3>
        <ol>
            ${denial.description.map(step => `<li>${step}</li>`).join('')}
        </ol>
    `;
}

// Populate list with filtered denials
function populateList(filter = '') {
    denialList.innerHTML = '';
    let filtered = denials.filter(d => {
        const searchText = filter.toLowerCase();
        return d.code.toLowerCase().includes(searchText) ||
               d.title.toLowerCase().includes(searchText) ||
               d.category.toLowerCase().includes(searchText) ||
               d.clinic.some(c => c.toLowerCase().includes(searchText)) ||
               d.description.some(desc => desc.toLowerCase().includes(searchText));
    });

    if (filtered.length === 0) {
        denialList.innerHTML = '<li>No results found.</li>';
        denialDetails.innerHTML = '<p>No denial details to show.</p>';
        return;
    }

    filtered.forEach((denial, index) => {
        const li = document.createElement('li');
        li.textContent = `${denial.code} - ${denial.title}`;
        li.onclick = () => {
            displayDenial(denial);
            // Remove active class from others
            document.querySelectorAll('#denialList li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
        };
        denialList.appendChild(li);

        // If first in filtered list, display by default
        if (index === 0) {
            li.classList.add('active');
            displayDenial(denial);
        }
    });
}

function loadDenials() {
    fetch('denials.json')
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            denials = data;
            populateList();
        })
        .catch(err => {
            errorDiv.textContent = 'Error loading denials. Make sure denials.json is in the root folder.';
            console.error(err);
        });
}

searchInput.addEventListener('input', () => {
    populateList(searchInput.value.trim());
});

// Initial load
loadDenials();

</script>

</body>
</html>
