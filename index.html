<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medical Billing Training – Pain Clinic</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        background-color: #f4f4f4;
    }

    #sidebar {
        width: 300px;
        background-color: #2F4F4F;
        color: white;
        overflow-y: auto;
        padding: 12px;
        box-sizing: border-box;
    }

    #sidebar h2 {
        margin-top: 0;
        font-size: 20px;
    }

    #searchInput {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
    }

    #denialList {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    #denialList li {
        padding: 8px;
        margin-bottom: 4px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 14px;
    }

    #denialList li:hover,
    #denialList li.active {
        background-color: #556B2F;
    }

    #content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: #f4f4f4;
    }

    h1, h3 {
        color: #2F4F4F;
        margin-bottom: 6px;
    }

    ol {
        margin-top: 5px;
    }

    .meta {
        margin-bottom: 10px;
        font-size: 14px;
    }

    .resolution {
        background-color: #e8f0ef;
        padding: 10px;
        border-left: 5px solid #2F4F4F;
        margin-bottom: 15px;
    }

    .remarks {
        font-style: italic;
        margin-top: 10px;
        color: #444;
    }

    #error {
        color: red;
        font-weight: bold;
    }
</style>
</head>

<body>

<div id="sidebar">
    <h2>Denial Codes (Pain Clinic)</h2>
    <input type="text" id="searchInput" placeholder="Search code, title, steps..." />
    <ul id="denialList"></ul>
</div>

<div id="content">
    <div id="error"></div>
    <div id="denialDetails">
        <h1>Medical Billing Training</h1>
        <p>Select a denial code from the left to view resolution steps.</p>
    </div>
</div>

<script>
let denials = [];

const denialList = document.getElementById('denialList');
const denialDetails = document.getElementById('denialDetails');
const searchInput = document.getElementById('searchInput');
const errorDiv = document.getElementById('error');

function displayDenial(denial) {
    denialDetails.innerHTML = `
        <h1>${denial.code} – ${denial.title}</h1>

        <div class="meta">
            <strong>Category:</strong> ${denial.category}<br />
            <strong>Clinic:</strong> ${denial.clinic.join(', ')}
        </div>

        <div class="resolution">
            <strong>Resolution:</strong> ${denial.resolution}
        </div>

        <h3>Step-by-step actions</h3>
        <ol>
            ${denial.steps.map(step => `<li>${step}</li>`).join('')}
        </ol>

        <div class="remarks">
            ${denial.remarks}
        </div>
    `;
}

function populateList(filter = '') {
    denialList.innerHTML = '';
    const searchText = filter.toLowerCase();

    const filtered = denials.filter(d =>
        d.code.toLowerCase().includes(searchText) ||
        d.title.toLowerCase().includes(searchText) ||
        d.category.toLowerCase().includes(searchText) ||
        d.steps.some(step => step.toLowerCase().includes(searchText))
    );

    if (filtered.length === 0) {
        denialList.innerHTML = '<li>No results found</li>';
        denialDetails.innerHTML = '<p>No denial details to show.</p>';
        return;
    }

    filtered.forEach((denial, index) => {
        const li = document.createElement('li');
        li.textContent = `${denial.code} - ${denial.title}`;

        li.onclick = () => {
            document.querySelectorAll('#denialList li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            displayDenial(denial);
        };

        denialList.appendChild(li);

        if (index === 0) {
            li.classList.add('active');
            displayDenial(denial);
        }
    });
}

function loadDenials() {
    fetch('denials.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            denials = data.denials;
            populateList();
        })
        .catch(err => {
            errorDiv.textContent =
                'Error loading denials.json. Make sure it is in the root folder and valid JSON.';
            console.error(err);
        });
}

searchInput.addEventListener('input', () => {
    populateList(searchInput.value.trim());
});

loadDenials();
</script>

</body>
</html>
