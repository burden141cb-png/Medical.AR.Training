<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Billing Training</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
    }
    #sidebar {
        width: 250px;
        background-color: #2F4F4F;
        color: white;
        overflow-y: auto;
        padding: 10px;
    }
    #sidebar h2 {
        font-size: 18px;
        margin-top: 0;
    }
    #sidebar ul {
        list-style: none;
        padding-left: 0;
    }
    #sidebar li {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
    }
    #sidebar li:hover {
        background-color: #556B2F;
    }
    #content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: #f4f4f4;
    }
    .keyword-section {
        margin-bottom: 20px;
    }
    h1, h3 {
        color: #2F4F4F;
    }
    ol {
        margin-left: 20px;
    }
    #search-bar {
        width: 100%;
        padding: 6px;
        margin-bottom: 10px;
        border-radius: 4px;
        border: none;
        font-size: 14px;
    }
</style>
</head>
<body>

<div id="sidebar">
    <h2>Denial Categories</h2>
    <input type="text" id="search-bar" placeholder="Search codes or keywords..." />
    <ul id="sidebar-ul">
        <!-- Sidebar items generated dynamically -->
    </ul>
</div>

<div id="content">
    <!-- Denial content loaded dynamically -->
</div>

<script>
// Fetch the denials JSON file
let allDenials = []; // Store for searching/filtering

fetch('denials.json')
  .then(response => response.json())
  .then(denialData => {
    allDenials = denialData;

    // Generate sidebar based on categories
    const sidebar = document.getElementById('sidebar-ul');
    const categories = [...new Set(denialData.map(d => d.category))];
    categories.forEach(cat => {
        const li = document.createElement('li');
        li.textContent = cat;
        li.onclick = () => showCategory(cat);
        sidebar.appendChild(li);
    });

    // Show first category by default
    showCategory(categories[0]);

  })
  .catch(err => {
      console.error("Failed to load denials.json", err);
      document.getElementById('content').innerHTML = "<p style='color:red;'>Error loading denials. Make sure denials.json is in the root folder.</p>";
  });

// Function to display denials by category
function showCategory(category) {
    const content = document.getElementById('content');
    content.innerHTML = ''; // Clear previous content

    allDenials.filter(d => d.category === category)
              .forEach(d => addDenialToContent(d));
}

// Function to render a denial
function addDenialToContent(d) {
    const content = document.getElementById('content');
    const div = document.createElement('div');
    div.classList.add('keyword-section');
    div.innerHTML = `<h1>${d.code}</h1>
                     <h3>${d.title}</h3>
                     <ol>${d.description.map(step => `<li>${step}</li>`).join('')}</ol>`;
    content.appendChild(div);
}

// Search bar functionality
document.getElementById('search-bar').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    const content = document.getElementById('content');
    content.innerHTML = '';

    allDenials.filter(d =>
        d.code.toLowerCase().includes(query) ||
        d.title.toLowerCase().includes(query) ||
        d.description.join(' ').toLowerCase().includes(query)
    ).forEach(d => addDenialToContent(d));
});
</script>

</body>
</html>
